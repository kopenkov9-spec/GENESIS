              u = this.mapXY(s, a.x, a.y),
              v = this.mapXY(s, b.x, b.y);
            if (Math.abs(u[0] - v[0]) < this.W * .8) line(c, ...u, ...v, 'rgba(223,203,145,.65)', this.z * 1.2);
          }
        }
        for (const b of w.buildings) {
          const [x, y] = this.mapXY(s, b.x, b.y);
          if (x > -30 && x < W + 30 && y > -40 && y < H + 40) building(c, b, x, y, this.z, p.seed);
        }
        for (const a of s.actors) {
          const [x, y] = this.mapXY(s, a.x, a.y);
          if (x < -45 || x > W + 45 || y < -40 || y > H + 40) continue;
          const genes = w.pops[a.pop % w.pops.length].genes,
            bad = a.role === 'hunter',
            el = this.animal(p.seed + a.id % 6, genes, bad, !micro),
            z = this.z * (bad ? .33 : .19);
          c.save();
          c.translate(x, y);
          c.rotate(a.angle);
          c.globalAlpha = a.stun ? .55 : .92;
          c.drawImage(el, -90 * z, -50 * z, 170 * z, 100 * z);
          c.restore();
        }
        if (s.era < 3) this.drawHero(s, p, W / 2, H / 2, t);
        else this.rover(s, W / 2, H / 2, t);
      } else this.space(s, t, lang);
      if (s.era === 5) {
        const r = (ground ? 24 : 28) * this.z;
        c.save();
        c.translate(W / 2, H / 2);
        c.rotate(t * .23);
        c.strokeStyle = 'rgba(148,217,203,.46)';
        c.lineWidth = .7;
        for (let i = 0; i < 3; i++) {
          c.rotate(TAU / 3);
          c.beginPath();
          c.ellipse(0, 0, r, r * .42, 0, .3, 2.45);
          c.stroke();
          oval(c, r * Math.cos(.3), r * .42 * Math.sin(.3), 1.6, 1.6, 0, '#b9d9b5');
        }
        c.restore();
      }
      if (s.nav) {
        const [x, y] = this.mapXY(s, s.nav.x, s.nav.y);
        c.setLineDash([3, 8]);
        line(c, W / 2, H / 2, x, y, 'rgba(225,218,158,.47)', 1);
        c.setLineDash([]);
        this.reticle(x, y, 10, '#e4c586');
      }
      this.reticle(W / 2, H / 2, (ground ? 17 : 19) * this.z, 'rgba(225,225,185,.65)');
      if (t - this.pulseAt < 1.4) {
        c.strokeStyle = 'rgba(150,235,214,' + (1 - (t - this.pulseAt) / 1.4) + ')';
        c.beginPath();
        c.arc(W / 2, H / 2, Math.max(0, (t - this.pulseAt) * 58 * this.z), 0, TAU);
        c.stroke();
      }
      const vignette = c.createRadialGradient(W / 2, H / 2, Math.min(W, H) * .23, W / 2, H / 2, Math.max(W, H) * .7);
      vignette.addColorStop(0, 'rgba(5,14,18,0)');
      vignette.addColorStop(1, 'rgba(5,14,18,.53)');
      c.fillStyle = vignette;
      c.fillRect(0, 0, W, H);
      this.ms = this.ms * .92 + (performance.now() - start) * .08;
      this.drawn++;
      if (quality === 'auto' && this.drawn % 90 === 0) this.lod = this.ms > 16 ? 0 : this.ms < 7 ? 2 : 1;
    }
    reticle(x, y, r, col) {
      const c = this.c;
      c.lineWidth = 1;
      c.strokeStyle = col;
      for (let i = 0; i < 4; i++) {
        c.beginPath();
        c.arc(x, y, r, (i + .12) * Math.PI / 2, (i + .36) * Math.PI / 2);
        c.stroke();
      }
    }
    filaments(p, s, t) {
      const c = this.c,
        r = G.rng(p.seed + 850);
      for (let i = 0; i < (this.lod ? 55 : 25); i++) {
        const a = {
            x: 512 + (r() - .5) * 390,
            y: 512 + (r() - .5) * 310
          },
          [x, y] = this.mapXY(s, a.x, a.y),
          z = this.z,
          f = r() * 5,
          sz = r() * 4 + 2;
        if (x < -60 || y < -60 || x > this.W + 60 || y > this.H + 60) continue;
        c.save();
        c.translate(x, y);
        c.rotate(f);
        c.strokeStyle = 'rgba(134,191,157,.18)';
        c.lineWidth = z * .4;
        c.beginPath();
        c.ellipse(0, 0, sz * z, sz * .38 * z, 0, 0, TAU);
        c.stroke();
        for (let j = -2; j <= 2; j++) line(c, j * sz * z * .35, -sz * z * .23, j * sz * z * .35 + Math.sin(t * .3 + f), sz * z * .23, 'rgba(148,186,149,.16)', .8);
        c.restore();
      }
    }
    vegetation(p, s) {
      const c = this.c,
        z = this.z,
        step = 22,
        nx = Math.ceil(this.W / (2 * z * step)) + 2,
        ny = Math.ceil(this.H / (2 * z * step)) + 2,
        ax = Math.floor(s.loc.x / step),
        ay = Math.floor(s.loc.y / step);
      for (let yy = -ny; yy <= ny; yy++) for (let xx = -nx; xx <= nx; xx++) {
        const gx = G.mod(ax + xx, 47),
          gy = G.mod(ay + yy, 47),
          h = G.hash(p.seed, gx, gy);
        if ((h & 3) > (this.lod ? 1 : 0)) continue;
        const x = (gx + h % 69 / 85) * 1024 / 47,
          y = (gy + (h >>> 8 & 63) / 80) * 1024 / 47,
          ht = G.terrain(p, x, y);
        if (ht < .50) continue;
        const [sx, sy] = this.mapXY(s, x, y),
          n = 3 + (h >>> 16 & 3),
          sz = z * (2 + (h >>> 20 & 3));
        line(c, sx, sy + 1, sx - 1, sy - sz * 1.9, '#536654', z);
        for (let j = 0; j < n; j++) {
          const a = j * 2.4 + (h & 15);
          oval(c, sx + Math.cos(a) * sz * .48, sy - sz + Math.sin(a) * sz * .5, sz * .65, sz * .30, a, p.temp < 5 ? '#a8b9aa' : '#91a57f');
        }
      }
    }
    rover(s, x, y, t) {
      const c = this.c,
        z = this.z;
      c.save();
      c.translate(x, y);
      c.rotate(s.loc.angle);
      oval(c, 0, 0, 7 * z, 4 * z, 0, '#d8c393');
      for (const a of [-1, 1]) for (const b of [-1, 1]) oval(c, a * 4 * z, b * 4 * z, 2.4 * z, 1.3 * z, 0, '#354547');
      line(c, 0, 0, 8 * z, 0, '#6fafa6', 2 * z);
      c.restore();
    }
    space(s, t, lang) {
      const c = this.c,
        W = this.W,
        H = this.H,
        z = this.z,
        sy = G.system(s.seed, s.loc.sid);
      glow(c, W * .36, H * .42, Math.max(W, H) * .8, 'rgba(47,82,88,.38)');
      this.dust(sy.seed, t, false);
      const [sx, syy] = this.mapXY(s, 512, 512),
        sun = sy.star === 'blue' ? '#abd6e8' : sy.star === 'red' ? '#ed987d' : '#f2cf8b';
      glow(c, sx, syy, 46 * z, 'rgba(242,185,111,.40)');
      oval(c, sx, syy, 10 * z, 10 * z, 0, sun);
      for (const b of G.bodies(s.seed, s.loc.sid, s.artificial[s.loc.sid] || [])) {
        const p = G.planet(s.seed, s.loc.sid, b.id),
          [x, y] = this.mapXY(s, b.x, b.y);
        c.strokeStyle = 'rgba(160,181,172,.13)';
        c.beginPath();
        c.arc(sx, syy, Math.hypot(b.x - 512, b.y - 512) * z, 0, TAU);
        c.stroke();
        if (x < -65 || x > W + 65 || y < -65 || y > H + 65) continue;
        G.planetDisc(c, x, y, b.r * z, p, this.texture(p));
        c.fillStyle = '#d3dccb';
        c.textAlign = 'center';
        c.font = '11px ui-monospace, monospace';
        c.fillText(b.name, x, y + b.r * z + 14);
        for (const [m, moon] of G.satellites(p).entries()) {
          const a = moon.phase + t / moon.period,
            d = (b.r + 5 + m * 3) * z;
          oval(c, x + Math.cos(a) * d, y + Math.sin(a) * d, moon.radius * z, moon.radius * z, 0, '#bdc9b9');
        }
      }
      const site = G.anomalySite(s.seed, s.loc.sid),
        [ax, ay] = this.mapXY(s, site.x, site.y);
      c.save();
      c.translate(ax, ay);
      c.rotate(t * .09);
      for (let j = 0; j < 4; j++) {
        c.rotate(.59);
        c.strokeStyle = j % 2 ? 'rgba(189,159,208,.56)' : 'rgba(138,206,192,.57)';
        c.beginPath();
        c.ellipse(0, 0, (10 + j) * z, (2 + j) * z, 0, 0, TAU);
        c.stroke();
      }
      c.restore();
      const st = s.stations[s.loc.sid];
      if (st) {
        const [x, y] = this.mapXY(s, st.x, st.y);
        building(c, {
          k: 'lab'
        }, x, y, z, sy.seed);
      }
      if (s.rings[s.loc.sid]) {
        c.strokeStyle = '#e8c78a';
        c.lineWidth = 2.2 * z;
        c.beginPath();
        c.ellipse(sx, syy, 22 * z, 6 * z, -.4, 0, TAU);
        c.stroke();
      }
      ship(c, W / 2, H / 2, z, s.loc.angle, s.ship.hull === 'organic', t);
    }
  }
  Object.assign(G, {
    Renderer,
    spriteSite,
    building,
    ship,
    COLORS
  });
})();

(() => {
  // The optional motes pass submits a single instanced draw. Game geometry stays readable on Canvas 2D.
  const shader = `
 struct Params { time:f32, aspect:f32, seed:f32, energy:f32 }
 @group(0) @binding(0) var<uniform> u:Params;
 struct V { @builtin(position) p:vec4<f32>, @location(0) uv:vec2<f32>, @location(1) a:f32 }
 fn fractHash(n:f32)->f32 { return fract(sin(n*12.9898+u.seed)*43758.54); }
 @vertex fn vert(@builtin(vertex_index) vi:u32,@builtin(instance_index) inst:u32)->V{
  let q=array<vec2<f32>,6>(vec2(-1.,-1.),vec2(1.,-1.),vec2(-1.,1.),vec2(-1.,1.),vec2(1.,-1.),vec2(1.,1.));
  let id=f32(inst)+1.;let corner=q[vi];let xx=fract(fractHash(id)+u.time*.0018*fractHash(id+23.));let yy=fract(fractHash(id+8.)+u.time*.0011);
  let radius=.0018+.0034*fractHash(id+41.);var v:V;v.uv=corner;v.a=.13+u.energy*.11;v.p=vec4(vec2(xx,yy)*2.-1.+corner*radius/vec2(u.aspect,1.),0.,1.);return v;
 }
 @fragment fn frag(v:V)->@location(0) vec4<f32>{let a=max(0.,1.-length(v.uv))*v.a;return vec4(vec3(.66,.88,.75)*a,a);}
 `;
  class Motes {
    constructor(el) {
      this.el = el;
      this.active = false;
      this.tried = false;
    }
    async init() {
      if (this.tried || !navigator.gpu) return;
      this.tried = true;
      try {
        const adapter = await navigator.gpu.requestAdapter({
          powerPreference: 'low-power'
        });
        if (!adapter) return;
        const device = await adapter.requestDevice();
        this.device = device;
        const ctx = this.el.getContext('webgpu');
        if (!ctx) return;
        this.ctx = ctx;
        const format = navigator.gpu.getPreferredCanvasFormat();
        ctx.configure({
          device,
          format,
          alphaMode: 'premultiplied'
        });
        const module = device.createShaderModule({
          code: shader
        });
        this.pipeline = await device.createRenderPipelineAsync({
          layout: 'auto',
          vertex: {
            module,
            entryPoint: 'vert'
          },
          fragment: {
            module,
            entryPoint: 'frag',
            targets: [{
              format,
              blend: {
                color: {
                  srcFactor: 'one',
                  dstFactor: 'one-minus-src-alpha'
                },
                alpha: {
                  srcFactor: 'one',
                  dstFactor: 'one-minus-src-alpha'
                }
              }
            }]
          },
          primitive: {
            topology: 'triangle-list'
          }
        });
        this.buffer = device.createBuffer({
          size: 16,
          usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST
        });
        this.group = device.createBindGroup({
          layout: this.pipeline.getBindGroupLayout(0),
          entries: [{
            binding: 0,
            resource: {
              buffer: this.buffer
            }
          }]
        });
        this.uniform = new Float32Array(4);
        this.active = true;
        device.lost.then(() => {
          this.active = false;
          this.el.hidden = true;
        });
      } catch {
        this.active = false;
      }
    }
    draw(w, h, t, seed, field, n) {
      if (!this.active) return;
      try {
        if (this.el.width !== w || this.el.height !== h) {
          this.el.width = Math.max(1, w);
          this.el.height = Math.max(1, h);
        }
        this.uniform.set([t, w / Math.max(1, h), seed % 997, field]);
        const d = this.device;
        d.queue.writeBuffer(this.buffer, 0, this.uniform);
        const e = d.createCommandEncoder(),
          pass = e.beginRenderPass({
            colorAttachments: [{
              view: this.ctx.getCurrentTexture().createView(),
              clearValue: {
                r: 0,
                g: 0,
                b: 0,
                a: 0
              },
              loadOp: 'clear',
              storeOp: 'store'
            }]
          });
        pass.setPipeline(this.pipeline);
        pass.setBindGroup(0, this.group);
        pass.draw(6, n);
        pass.end();
        d.queue.submit([e.finish()]);
      } catch {
        this.active = false;
        this.el.hidden = true;
      }
    }
  }
  G.Motes = Motes;
})();

(() => {
  function planetMap(canvas, s, renderer) {
    const W = canvas.width,
      H = canvas.height,
      c = canvas.getContext('2d'),
      p = G.body(s),
      w = G.world(s);
    c.drawImage(renderer.texture(p), 0, 0, W, H);
    c.fillStyle = 'rgba(13,31,33,.18)';
    c.fillRect(0, 0, W, H);
    for (let i = 1; i < 8; i++) {
      G.line(c, i * W / 8, 0, i * W / 8, H, 'rgba(203,217,192,.22)', .7);
      G.line(c, 0, i * H / 8, W, i * H / 8, 'rgba(203,217,192,.22)', .7);
    }
    for (const a of G.points(p)) {
      if (a.k.startsWith('tribe') && s.era < 2) continue;
      const x = a.x / 1024 * W,
        y = a.y / 1024 * H;
      G.oval(c, x, y, 2.25, 2.25, 0, G.COLORS[a.k] || '#e6b876');
    }
    for (const b of w.buildings) {
      const x = b.x / 1024 * W,
        y = b.y / 1024 * H;
      c.fillStyle = '#ffdf8d';
      c.fillRect(x - 3, y - 3, 6, 6);
    }
    const x = s.loc.x / 1024 * W,
      y = s.loc.y / 1024 * H;
    c.strokeStyle = '#ffe0a1';
    c.lineWidth = 1.5;
    c.beginPath();
    c.arc(x, y, 8, 0, G.TAU);
    c.stroke();
    G.line(c, x - 12, y, x + 12, y, '#ffe0a1', 1);
    G.line(c, x, y - 12, x, y + 12, '#ffe0a1', 1);
  }
  function galaxyMap(canvas, s, stars, selected) {
    const W = canvas.width,
      H = canvas.height,
      c = canvas.getContext('2d'),
      at = G.coords(s.loc.sid);
    c.fillStyle = '#112127';
    c.fillRect(0, 0, W, H);
    G.sky(c, W, H, G.hash(s.seed, at.x, at.y), 85);
    for (let i = 0; i < 8; i++) {
      G.line(c, i * W / 7, 0, i * W / 7, H, 'rgba(164,193,181,.14)', 1);
      G.line(c, 0, i * H / 7, W, i * H / 7, 'rgba(164,193,181,.14)', 1);
    }
    const pts = [];
    for (const st of stars) {
      const x = (st.dx + 3.5) * W / 7,
        y = (st.dy + 3.5) * H / 7;
      pts.push({
        ...st,
        x,
        y
      });
      const col = st.star === 'blue' ? '#a4d9ed' : st.star === 'red' ? '#e8a68d' : st.star === 'white' ? '#e0e5d9' : '#e6cc95';
      G.oval(c, x, y, st.sid === s.loc.sid ? 4.3 : 2.5, st.sid === s.loc.sid ? 4.3 : 2.5, 0, col);
      if (st.sid === selected || st.sid === s.loc.sid) {
        c.strokeStyle = st.sid === selected ? '#e9bd79' : '#87cabe';
        c.lineWidth = 1.2;
        c.beginPath();
        c.arc(x, y, 8, 0, G.TAU);
        c.stroke();
        c.fillStyle = col;
        c.font = '11px monospace';
        c.textAlign = 'center';
        c.fillText(st.name, x, y + 20);
      }
    }
    return pts;
  }
  G.planetMap = planetMap;
  G.galaxyMap = galaxyMap;
})();
